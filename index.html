<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Database Anggota IMABA Yogyakarta</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts Inter / Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- React 18, ReactDOM, and Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    @keyframes softFade {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: softFade 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .custom-scrollbar::-webkit-scrollbar {
      height: 6px;
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col selection:bg-emerald-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // URL Web App Google Apps Script Aktif
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwXD7cigdkLLqOfCjmLNpqmuErzR3ex7oxZmYU-5sxqfQEPZUEfp2n9YqE-ZwN9rCKU/exec";

    // Format nomor WhatsApp menjadi standar diawali '08...'
    const formatPhone = (val) => {
      if (!val) return "";
      let clean = String(val).replace(/\D/g, '');
      if (clean.startsWith('62')) {
        clean = '0' + clean.slice(2);
      } else if (!clean.startsWith('0') && clean.length > 0) {
        clean = '0' + clean;
      }
      return clean;
    };

    const maskPhone = (phone) => {
      if (!phone || phone.length < 8) return "Belum Terhubung";
      return phone.slice(0, 4) + "****" + phone.slice(-3);
    };

    const getTodayTimestamp = () => {
      const now = new Date();
      return now.toISOString().replace('T', ' ').slice(0, 19);
    };

    // Komponen Ikon SVG
    const IconCheck = () => (
      <svg className="w-4 h-4 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2.5">
        <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" />
      </svg>
    );

    const IconBuilding = () => (
      <svg className="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
      </svg>
    );

    const IconMapPin = () => (
      <svg className="w-3.5 h-3.5 shrink-0 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
        <path strokeLinecap="round" strokeLinejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
    );

    const IconSearch = () => (
      <svg className="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
    );

    const IconShield = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
      </svg>
    );

    const IconWhatsapp = () => (
      <svg className="w-3.5 h-3.5 shrink-0" fill="currentColor" viewBox="0 0 24 24">
        <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
      </svg>
    );

    const IconDownload = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
      </svg>
    );

    function App() {
      const [members, setMembers] = useState(() => {
        try {
          const local = localStorage.getItem('IMABA_YOGYA_DATABASE_PROD_v2');
          return local ? JSON.parse(local) : [];
        } catch (e) {
          return [];
        }
      });

      const [isLoading, setIsLoading] = useState(false);
      const [activeTab, setActiveTab] = useState('register'); // 'register' | 'login' | 'profile' | 'directory' | 'admin'

      // State Autentikasi Anggota
      const [currentUser, setCurrentUser] = useState(null);
      const [loginPhone, setLoginPhone] = useState('');
      const [otpModal, setOtpModal] = useState(false);
      const [simulatedOtp, setSimulatedOtp] = useState('');
      const [enteredOtp, setEnteredOtp] = useState('');

      // State Notifikasi Toast
      const [toast, setToast] = useState({ show: false, msg: '', type: 'success' });
      const triggerToast = (msg, type = 'success') => {
        setToast({ show: true, msg, type });
        setTimeout(() => setToast({ show: false, msg: '', type: 'success' }), 3500);
      };

      // State Form Registrasi Baru
      const [regForm, setRegForm] = useState({
        nama: '',
        jenisKelamin: 'Laki-laki',
        noWa: '',
        asalDaerah: 'Pamekasan',
        alamatAsal: '',
        domisiliJogja: '',
        kampus: 'UIN Sunan Kalijaga',
        kampusLain: '',
        fakultas: '',
        prodi: '',
        angkatan: '2024',
        minatDivisi: 'Kaderisasi & Keilmuan'
      });

      // State Filter Direktori
      const [searchQuery, setSearchQuery] = useState('');
      const [filterKampus, setFilterKampus] = useState('Semua');
      const [filterDaerah, setFilterDaerah] = useState('Semua');

      // State Panel Admin Pengurus
      const [adminPin, setAdminPin] = useState('');
      const [isAdmin, setIsAdmin] = useState(false);
      const [adminError, setAdminError] = useState('');

      // Mengambil data anggota langsung dari Google Spreadsheet secara real-time
      const fetchMembersFromSpreadsheet = async () => {
        if (!SCRIPT_URL || SCRIPT_URL.includes("GANTI_DENGAN_URL")) return;
        setIsLoading(true);
        try {
          const res = await fetch(SCRIPT_URL);
          const result = await res.json();
          if (result.status === "success" && Array.isArray(result.members)) {
            setMembers(result.members);
            localStorage.setItem('IMABA_YOGYA_DATABASE_PROD_v2', JSON.stringify(result.members));
            triggerToast('Data berhasil disinkronisasi dari Google Spreadsheet!');
          }
        } catch (err) {
          console.log("Menggunakan cache lokal:", err);
        } finally {
          setIsLoading(false);
        }
      };

      useEffect(() => {
        fetchMembersFromSpreadsheet();
      }, []);

      useEffect(() => {
        try {
          localStorage.setItem('IMABA_YOGYA_DATABASE_PROD_v2', JSON.stringify(members));
        } catch (e) {}
      }, [members]);

      const handleRegisterSubmit = async (e) => {
        e.preventDefault();
        const cleanPhone = formatPhone(regForm.noWa);
        if (!cleanPhone || cleanPhone.length < 10) {
          triggerToast('Harap masukkan nomor WhatsApp yang aktif dan valid.', 'error');
          return;
        }

        // Cek apakah nomor sudah terdaftar
        const existing = members.find(m => formatPhone(m.noWa) === cleanPhone);
        if (existing) {
          triggerToast('Nomor WhatsApp ini sudah terdaftar! Silakan langsung login di menu Masuk.', 'error');
          return;
        }

        const newMember = {
          id: members.length + 1,
          timestamp: getTodayTimestamp(),
          nama: regForm.nama.trim(),
          jenisKelamin: regForm.jenisKelamin,
          noWa: cleanPhone,
          asalDaerah: regForm.asalDaerah,
          alamatAsal: regForm.alamatAsal.trim(),
          domisiliJogja: regForm.domisiliJogja.trim(),
          kampus: regForm.kampus === 'Lainnya' ? (regForm.kampusLain.trim() || 'Kampus di DIY') : regForm.kampus,
          fakultas: regForm.fakultas.trim(),
          prodi: regForm.prodi.trim(),
          angkatan: regForm.angkatan.trim() || '2024',
          minatDivisi: regForm.minatDivisi,
          status: 'Aktif'
        };

        // Simpan langsung ke Google Spreadsheet jika URL tersedia
        if (SCRIPT_URL && !SCRIPT_URL.includes("GANTI_DENGAN_URL")) {
          triggerToast('Menyimpan data ke Google Spreadsheet...');
          try {
            await fetch(SCRIPT_URL, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({ action: 'register', data: newMember })
            });
            setTimeout(() => fetchMembersFromSpreadsheet(), 1200);
          } catch (err) {
            console.error("Gagal sync ke Spreadsheet:", err);
          }
        }

        const updated = [newMember, ...members];
        setMembers(updated);
        setCurrentUser(newMember);
        setActiveTab('profile');
        triggerToast(`Ahlan wa Sahlan, Sahabat ${newMember.nama}! Data Anda berhasil disimpan.`);
      };

      const handleRequestOtp = (e) => {
        e.preventDefault();
        const clean = formatPhone(loginPhone);
        if (!clean || clean.length < 10) {
          triggerToast('Masukkan nomor WhatsApp yang valid (contoh: 081234567890)', 'error');
          return;
        }

        const match = members.find(m => formatPhone(m.noWa) === clean);
        if (!match) {
          triggerToast('Nomor belum terdaftar di database IMABA. Silakan isi form pendaftaran anggota baru.', 'error');
          return;
        }

        const otp = Math.floor(100000 + Math.random() * 900000).toString();
        setSimulatedOtp(otp);
        setOtpModal(true);
      };

      const handleVerifyOtp = (e) => {
        e.preventDefault();
        if (enteredOtp.trim() !== simulatedOtp.trim()) {
          triggerToast('Kode OTP salah atau tidak cocok! Silakan periksa kembali.', 'error');
          return;
        }

        const clean = formatPhone(loginPhone);
        const match = members.find(m => formatPhone(m.noWa) === clean);
        if (match) {
          setCurrentUser({ ...match });
          setOtpModal(false);
          setEnteredOtp('');
          setActiveTab('profile');
          triggerToast(`Selamat datang kembali, Sahabat ${match.nama}!`);
        }
      };

      const handleSaveProfile = async (e) => {
        e.preventDefault();
        if (!currentUser) return;

        // Sinkronisasi update ke Google Spreadsheet
        if (SCRIPT_URL && !SCRIPT_URL.includes("GANTI_DENGAN_URL")) {
          triggerToast('Memperbarui profil di Google Spreadsheet...');
          try {
            await fetch(SCRIPT_URL, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({ action: 'update', data: currentUser })
            });
            setTimeout(() => fetchMembersFromSpreadsheet(), 1200);
          } catch (err) {
            console.error("Gagal sync update:", err);
          }
        }

        setMembers(prev => prev.map(m => m.id === currentUser.id ? { ...currentUser } : m));
        triggerToast('Alhamdulillah, profil Anda telah berhasil diperbarui!');
      };

      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (adminPin === '1986' || adminPin === '123456' || adminPin === 'imabajogja') {
          setIsAdmin(true);
          setAdminError('');
          triggerToast('Akses Pengurus DPW IMABA Diterima.', 'success');
        } else {
          setAdminError('PIN Pengurus salah! (PIN Default: 123456 atau 1986)');
        }
      };

      const handleExportCsv = () => {
        const headers = [
          "Timestamp",
          "Nama Lengkap",
          "Jenis Kelamin",
          "No WhatsApp",
          "Asal Kabupaten/Kota",
          "Alamat Asal",
          "Alamat Domisili di Yogyakarta",
          "Kampus / Perguruan Tinggi",
          "Fakultas",
          "Program Studi",
          "Angkatan",
          "Minat Divisi",
          "Status"
        ];

        const rows = members.map(m => [
          `"${m.timestamp || ''}"`,
          `"${(m.nama || '').replace(/"/g, '""')}"`,
          `"${m.jenisKelamin || ''}"`,
          `'${m.noWa || ''}`,
          `"${m.asalDaerah || ''}"`,
          `"${(m.alamatAsal || '').replace(/"/g, '""')}"`,
          `"${(m.domisiliJogja || '').replace(/"/g, '""')}"`,
          `"${(m.kampus || '').replace(/"/g, '""')}"`,
          `"${(m.fakultas || '').replace(/"/g, '""')}"`,
          `"${(m.prodi || '').replace(/"/g, '""')}"`,
          `"${m.angkatan || ''}"`,
          `"${m.minatDivisi || ''}"`,
          `"${m.status || 'Aktif'}"`
        ]);

        const csvContent = "data:text/csv;charset=utf-8,\uFEFF" + [headers.join(","), ...rows.map(r => r.join(","))].join("\n");
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `DATA_ANGGOTA_IMABA_YOGYAKARTA_${new Date().toISOString().slice(0, 10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        triggerToast('File Spreadsheet Excel/CSV berhasil diunduh!');
      };

      const filteredMembers = useMemo(() => {
        return members.filter(item => {
          const q = searchQuery.toLowerCase();
          const matchQuery = (item.nama || '').toLowerCase().includes(q) ||
                             (item.kampus || '').toLowerCase().includes(q) ||
                             (item.prodi || '').toLowerCase().includes(q) ||
                             (item.asalDaerah || '').toLowerCase().includes(q) ||
                             (item.domisiliJogja && item.domisiliJogja.toLowerCase().includes(q));

          const matchKampus = filterKampus === 'Semua' ? true : (item.kampus || '').toLowerCase().includes(filterKampus.toLowerCase());
          const matchDaerah = filterDaerah === 'Semua' ? true : item.asalDaerah === filterDaerah;

          return matchQuery && matchKampus && matchDaerah;
        });
      }, [members, searchQuery, filterKampus, filterDaerah]);

      return (
        <div className="flex-1 flex flex-col">
          {/* Toast Notification */}
          {toast.show && (
            <div className="fixed top-5 right-5 z-50 animate-bounce">
              <div className={`px-4 py-3 rounded-2xl shadow-xl text-white text-xs sm:text-sm font-semibold flex items-center gap-2.5 ${
                toast.type === 'error' ? 'bg-rose-600' : 'bg-emerald-600'
              }`}>
                <span className="w-2 h-2 rounded-full bg-white animate-pulse"></span>
                <span>{toast.msg}</span>
              </div>
            </div>
          )}

          <header className="bg-gradient-to-r from-emerald-900 via-emerald-800 to-teal-900 text-white shadow-md sticky top-0 z-30 border-b border-emerald-700/50">
            <div className="max-w-6xl mx-auto px-4 py-3 flex flex-col sm:flex-row items-center justify-between gap-3">
              <div className="flex items-center gap-3">
                <div className="w-11 h-11 rounded-2xl bg-gradient-to-br from-amber-400 to-amber-600 flex items-center justify-center text-emerald-950 shadow-md font-extrabold text-sm border-2 border-amber-300">
                  IMB
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="text-base sm:text-lg font-bold tracking-tight">IMABA YOGYAKARTA</h1>
                    <span className="text-[10px] bg-amber-400/20 text-amber-300 border border-amber-400/40 px-2 py-0.5 rounded-full font-semibold">
                      DPW D.I. Yogyakarta
                    </span>
                  </div>
                  <p className="text-[11px] text-emerald-200">Ikatan Mahasiswa Bata-Bata</p>
                </div>
              </div>

              {/* Navigation Menu */}
              <nav className="flex items-center gap-1 bg-emerald-950/60 p-1.5 rounded-2xl text-xs font-semibold border border-emerald-700/40">
                <button
                  onClick={fetchMembersFromSpreadsheet}
                  className="px-2.5 py-1.5 rounded-xl text-emerald-200 hover:text-white hover:bg-emerald-900/60 transition-all flex items-center gap-1"
                  title="Sinkronisasi dengan Spreadsheet"
                >
                  <span className={isLoading ? "animate-spin" : ""}>🔄</span>
                </button>

                <button
                  onClick={() => setActiveTab('register')}
                  className={`px-3 py-1.5 rounded-xl transition-all ${
                    activeTab === 'register' ? 'bg-emerald-600 text-white shadow' : 'text-emerald-200 hover:text-white'
                  }`}
                >
                  + Input Data Baru
                </button>

                {currentUser ? (
                  <button
                    onClick={() => setActiveTab('profile')}
                    className={`px-3 py-1.5 rounded-xl transition-all ${
                      activeTab === 'profile' ? 'bg-emerald-600 text-white shadow' : 'text-emerald-200 hover:text-white'
                    }`}
                  >
                    Profil Saya
                  </button>
                ) : (
                  <button
                    onClick={() => setActiveTab('login')}
                    className={`px-3 py-1.5 rounded-xl transition-all ${
                      activeTab === 'login' ? 'bg-emerald-600 text-white shadow' : 'text-emerald-200 hover:text-white'
                    }`}
                  >
                    Masuk Akun
                  </button>
                )}

                <button
                  onClick={() => setActiveTab('directory')}
                  className={`px-3 py-1.5 rounded-xl transition-all ${
                    activeTab === 'directory' ? 'bg-emerald-600 text-white shadow' : 'text-emerald-200 hover:text-white'
                  }`}
                >
                  Direktori ({members.length})
                </button>

                <button
                  onClick={() => setActiveTab('admin')}
                  className={`px-3 py-1.5 rounded-xl transition-all ${
                    activeTab === 'admin' ? 'bg-emerald-600 text-white shadow' : 'text-emerald-200 hover:text-white'
                  }`}
                >
                  Pengurus
                </button>

                {currentUser && (
                  <button
                    onClick={() => { setCurrentUser(null); setActiveTab('register'); triggerToast('Anda telah keluar.'); }}
                    className="px-2.5 py-1.5 text-rose-300 hover:bg-rose-900/30 rounded-lg text-xs"
                    title="Keluar"
                  >
                    Keluar
                  </button>
                )}
              </nav>
            </div>
          </header>

          <main className="flex-1 max-w-6xl w-full mx-auto px-4 py-6 sm:py-8">

            {/* TAB 1: FORMULIR INPUT DATA ANGGOTA BARU */}
            {activeTab === 'register' && (
              <div className="max-w-2xl mx-auto animate-fade-in">
                <div className="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                  <div className="bg-gradient-to-r from-emerald-800 to-teal-800 p-6 sm:p-7 text-white">
                    <span className="text-[11px] bg-amber-400 text-emerald-950 font-bold px-2.5 py-1 rounded-full uppercase tracking-wider">
                      Formulir Sensus Anggota
                    </span>
                    <h2 className="text-xl sm:text-2xl font-bold mt-2">Pendaftaran & Update Anggota IMABA</h2>
                    <p className="text-xs text-emerald-100 mt-1 leading-relaxed">
                      Selamat datang mahasiswa santri Pondok Pesantren Mambaul Ulum Bata-Bata di Yogyakarta. Silakan lengkapi biodata Anda di bawah ini.
                    </p>
                  </div>

                  <form onSubmit={handleRegisterSubmit} className="p-6 sm:p-8 space-y-5">
                    {/* Bagian 1: Identitas Pribadi */}
                    <div className="space-y-4">
                      <h3 className="text-xs font-bold text-emerald-800 uppercase tracking-wider border-b border-emerald-100 pb-1.5">
                        1. Identitas Personal
                      </h3>

                      <div>
                        <label className="block text-xs font-bold text-slate-700 uppercase mb-1">
                          Nama Lengkap <span className="text-rose-500">*</span>
                        </label>
                        <input
                          type="text"
                          placeholder="Sesuai KTP / Ijazah"
                          value={regForm.nama}
                          onChange={(e) => setRegForm({ ...regForm, nama: e.target.value })}
                          required
                          className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm font-medium focus:ring-2 focus:ring-emerald-500 outline-none"
                        />
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                          <label className="block text-xs font-bold text-slate-700 uppercase mb-1">
                            Jenis Kelamin <span className="text-rose-500">*</span>
                          </label>
                          <select
                            value={regForm.jenisKelamin}
                            onChange={(e) => setRegForm({ ...regForm, jenisKelamin: e.target.value })}

                      >
                        <div>
                          <div className="flex items-start justify-between gap-2 mb-1.5">
                            <div>
                              <h4 className="font-bold text-slate-900 text-sm">{item.nama}</h4>
                              <p className="text-[11px] text-emerald-700 font-semibold">Asal {item.asalDaerah}</p>
                            </div>
                            <span className="text-[10px] px-2 py-0.5 rounded-full font-bold bg-slate-100 text-slate-600">
                              #{item.angkatan}
                            </span>
                          </div>

                          <div className="space-y-1 my-2.5 text-xs text-slate-600">
                            <p className="flex items-center gap-1.5 font-medium">
                              <IconBuilding /> <span className="text-slate-900 font-bold">{item.kampus}</span>
                            </p>
                            <p className="text-[11px] text-slate-500 pl-5">
                              {item.prodi} {item.fakultas ? `(${item.fakultas})` : ''}
                            </p>
                            <p className="flex items-center gap-1.5 text-[11px]">
                              <IconMapPin /> <span className="truncate">{item.domisiliJogja}</span>
                            </p>
                          </div>
                        </div>

                        <div className="pt-2.5 mt-2.5 border-t border-slate-100 flex items-center justify-between text-xs">
                          <span className="font-mono text-[11px] text-slate-400">
                            {maskPhone(item.noWa)}
                          </span>
                          <span className="text-[10px] px-2 py-0.5 bg-emerald-50 text-emerald-700 font-medium rounded-md">
                            {item.minatDivisi}
                          </span>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* TAB 5: PANEL PENGURUS DPW IMABA */}
            {activeTab === 'admin' && (
              <div className="animate-fade-in">
                {!isAdmin ? (
                  <div className="max-w-sm mx-auto bg-white rounded-3xl shadow-sm border border-slate-200 p-6 sm:p-8 text-center">
                    <div className="w-12 h-12 mx-auto mb-2 bg-emerald-50 text-emerald-800 rounded-2xl flex items-center justify-center">
                      <IconShield />
                    </div>
                    <h3 className="text-lg font-bold text-slate-800">Panel Pengurus DPW</h3>
                    <p className="text-xs text-slate-500 mt-1 mb-4">
                      Masukkan PIN Pengurus IMABA Yogyakarta untuk mengunduh rekap dan melihat kontak lengkap.
                    </p>

                    <form onSubmit={handleAdminLogin} className="space-y-3">
                      <input
                        type="password"
                        placeholder="PIN..."
                        value={adminPin}
                        onChange={(e) => setAdminPin(e.target.value)}
                        required
                        className="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-center font-mono tracking-widest text-lg outline-none focus:ring-2 focus:ring-emerald-500"
                      />
                      {adminError && <p className="text-xs text-rose-600 font-semibold">{adminError}</p>}
                      <button
                        type="submit"
                        className="w-full py-2.5 bg-emerald-700 hover:bg-emerald-800 text-white font-bold text-xs rounded-xl cursor-pointer"
                      >
                        Buka Akses Pengurus
                      </button>
                    </form>
                    <p className="text-[10px] text-slate-400 mt-3">PIN Default: <strong>123456</strong> atau <strong>1986</strong></p>
                  </div>
                ) : (
                  <div className="space-y-5">
                    <div className="bg-gradient-to-r from-emerald-900 to-teal-900 text-white p-5 rounded-3xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 shadow-md">
                      <div>
                        <span className="text-[10px] bg-amber-400 text-emerald-950 font-extrabold px-2.5 py-0.5 rounded-full uppercase">
                          Administrator Aktif
                        </span>
                        <h3 className="text-xl font-bold mt-1">Database Anggota IMABA Yogyakarta</h3>
                        <p className="text-xs text-emerald-200">Total {members.length} anggota terdaftar dalam sistem.</p>
                      </div>

                      <div className="flex items-center gap-2">
                        <button
                          onClick={handleExportCsv}
                          className="px-4 py-2.5 bg-amber-400 hover:bg-amber-300 text-emerald-950 font-bold text-xs rounded-xl shadow flex items-center gap-1.5 transition-all cursor-pointer"
                        >
                          <IconDownload /> Unduh Excel / CSV (Jawaban)
                        </button>
                        <button
                          onClick={() => setIsAdmin(false)}
                          className="px-3 py-2.5 bg-emerald-800 hover:bg-emerald-700 text-emerald-200 text-xs rounded-xl cursor-pointer"
                        >
                          Kunci Admin
                        </button>
                      </div>
                    </div>

                    <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                      <div className="overflow-x-auto max-h-[500px] custom-scrollbar">
                        <table className="w-full text-left text-xs">
                          <thead className="bg-slate-100 sticky top-0 z-10 text-slate-600 uppercase font-bold text-[10px] tracking-wider">
                            <tr>
                              <th className="p-3">No</th>
                              <th className="p-3">Nama Lengkap</th>
                              <th className="p-3">Kampus & Prodi</th>
                              <th className="p-3">Asal & Domisili</th>
                              <th className="p-3">WhatsApp</th>
                              <th className="p-3 text-center">Hubungi WA</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-200">
                            {members.length === 0 ? (
                              <tr>
                                <td colSpan="6" className="p-8 text-center text-slate-400 font-medium">
                                  Belum ada data anggota yang terdaftar di sistem.
                                </td>
                              </tr>
                            ) : (
                              members.map((m, idx) => (
                                <tr key={m.id || idx} className="hover:bg-slate-50 transition-colors">
                                  <td className="p-3 font-bold text-slate-400">{idx + 1}</td>
                                  <td className="p-3">
                                    <div className="font-bold text-slate-900">{m.nama}</div>
                                    <div className="text-[10px] text-emerald-700 font-semibold">Angkatan {m.angkatan}</div>
                                  </td>
                                  <td className="p-3">
                                    <div className="font-semibold text-slate-800">{m.kampus}</div>
                                    <div className="text-[10px] text-slate-500">{m.prodi}</div>
                                  </td>
                                  <td className="p-3 max-w-xs">
                                    <div className="font-medium text-slate-800">{m.asalDaerah}</div>
                                    <div className="text-[10px] text-slate-500 truncate">{m.domisiliJogja}</div>
                                  </td>
                                  <td className="p-3 font-mono font-medium text-slate-700">
                                    {m.noWa}
                                  </td>
                                  <td className="p-3 text-center">
                                    <a
                                      href={`https://wa.me/62${String(m.noWa).replace(/\D/g, '').replace(/^0/, '')}?text=${encodeURIComponent(`Assalamu'alaikum Wr. Wb. Sahabat ${m.nama}, salam silaturahmi dari Pengurus DPW IMABA Yogyakarta.`)}`}
                                      target="_blank"
                                      rel="noopener noreferrer"
                                      className="inline-flex items-center gap-1 px-3 py-1 bg-emerald-100 text-emerald-800 rounded-lg hover:bg-emerald-200 font-bold text-[11px]"
                                    >
                                      <IconWhatsapp /> Chat
                                    </a>
                                  </td>
                                </tr>
                              ))
                            )}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}

          </main>

          {/* OTP Simulation Modal */}
          {otpModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-xs w-full p-6 shadow-2xl border border-slate-100 text-center animate-fade-in">
                <div className="w-12 h-12 bg-emerald-50 text-emerald-700 rounded-full flex items-center justify-center mx-auto mb-2">
                  <IconWhatsapp />
                </div>
                <h3 className="font-bold text-slate-900 text-base">Verifikasi WhatsApp</h3>
                <p className="text-[11px] text-slate-500 mt-0.5 mb-3">
                  Kode masuk untuk <strong>{formatPhone(loginPhone)}</strong>
                </p>

                <div className="p-3 bg-emerald-50 border border-emerald-300 rounded-2xl text-left mb-3">
                  <p className="text-[10px] text-emerald-900 font-bold uppercase mb-1">Simulasi Pesan Bot IMABA:</p>
                  <p className="text-center font-mono font-bold text-xl text-emerald-800 bg-white py-1 rounded-xl border border-emerald-200">
                    {simulatedOtp}
                  </p>
                </div>

                <form onSubmit={handleVerifyOtp} className="space-y-2">
                  <input
                    type="text"
                    placeholder="6 Digit Kode"
                    value={enteredOtp}
                    onChange={(e) => setEnteredOtp(e.target.value)}
                    maxLength={6}
                    required
                    className="w-full text-center tracking-widest font-mono text-lg py-2 bg-slate-50 border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500"
                  />
                  <button
                    type="button"
                    onClick={() => setEnteredOtp(simulatedOtp)}
                    className="w-full py-1 text-[11px] font-semibold text-emerald-700 hover:underline"
                  >
                    Tempel Kode Otomatis
                  </button>
                  <button
                    type="submit"
                    className="w-full py-2.5 bg-emerald-700 hover:bg-emerald-800 text-white font-bold text-xs rounded-xl shadow cursor-pointer"
                  >
                    Verifikasi & Masuk Profil
                  </button>
                </form>

                <button onClick={() => setOtpModal(false)} className="mt-2.5 text-[11px] text-slate-400 hover:text-slate-600">
                  Batal
                </button>
              </div>
            </div>
          )}

          <footer className="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500 mt-auto">
            <p className="font-semibold text-slate-700">© 2026 DPW IMABA (Ikatan Mahasiswa Bata-Bata) Yogyakarta</p>
            <p className="text-[11px] text-slate-400 mt-0.5">Sistem Pendataan & Sensus Mahasiswa Santri Berbasis Web Mandiri</p>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
